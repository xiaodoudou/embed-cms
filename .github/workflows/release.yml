name: Release

# Pushing a version tag (v3.0.2, v3.1.0-rc.1...) runs the whole test suite, then publishes the package to npm, then creates the
# GitHub release. A step that fails stops the ones after it: nothing is published from a red build.
#
# One-time setup on npmjs.com (no token to store): the package page > Settings > Trusted Publisher > GitHub Actions, with the
# repository xiaodoudou/embed-cms and the workflow file name release.yml (and no environment). Publishing then proves its
# identity to npm with the OpenID Connect token of the run, and the package gets its provenance badge.

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  # a tag that does not name the version of package.json, or that is not on the main branch, is not a release
  check:
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::the tag $GITHUB_REF_NAME does not name the version of package.json ($version)"
            exit 1
          fi
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::the tag $GITHUB_REF_NAME is not on the main branch"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          case "$version" in *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

  # the same jobs as on every push (lint, unit, security and frontend tests, build, audit, database drivers)
  test:
    needs: check
    uses: ./.github/workflows/test.yml

  publish:
    needs: [check, test]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # the OpenID Connect token of trusted publishing and of the provenance
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      # trusted publishing needs npm 11.5.1 or later; not npm 12, which refuses by default the dependencies fetched from a URL (vue3-shortkey is one)
      - run: npm install -g 'npm@^11.5.1'
      - run: npm ci
      # a prerelease (3.1.0-rc.1) goes to the `next` tag, so that `npm install embed-cms` keeps giving the last stable version
      - name: Publish to npm
        run: |
          if [ "${{ needs.check.outputs.prerelease }}" = "true" ]; then
            npm publish --tag next
          else
            npm publish
          fi

  release:
    needs: [check, publish]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          flags=""
          if [ "$PRERELEASE" = "true" ]; then flags="--prerelease"; fi
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "Embed CMS $VERSION" --generate-notes $flags \
            --notes "Install with \`npm install embed-cms@$VERSION\` ([embed-cms on npm](https://www.npmjs.com/package/embed-cms/v/$VERSION))."
