name: Tests

on:
  push:
    branches: [main, dev]
  pull_request:
  # the release workflow runs the same jobs before it publishes
  workflow_call:

jobs:
  # The commit messages follow Conventional Commits (CONTRIBUTING.md): the commits of a pull request, the title of a pull request into main (it
  # becomes the message of the squash commit there), and the commits of a push
  commits:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Commits of the pull request
        if: github.event_name == 'pull_request'
        run: node scripts/commitlint.js --range "$BASE..$HEAD"
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
      - name: Title of the pull request into main
        if: github.event_name == 'pull_request' && github.base_ref == 'main'
        run: node scripts/commitlint.js --title "$TITLE"
        env:
          TITLE: ${{ github.event.pull_request.title }}
      - name: Commits of the push
        if: github.event_name == 'push'
        run: |
          if [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            node scripts/commitlint.js --range "$BEFORE..$AFTER"
          else
            echo "No earlier commit to compare with (a new branch, a tag or a forced push): nothing to check"
          fi
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}

  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npx eslint lib src index.js test/unit test/security test/integration test/helpers test/bench
      - name: Backend unit and security tests
        run: npm run test:unit
      - name: Frontend tests
        run: npm run test:frontend
      - name: Legacy integration suite
        run: npm test
        env:
          TEST_PORT: 9985
      - name: Production build
        run: npm run build
      - name: Dependency audit
        run: npm audit --omit=dev --audit-level=high

  # The driver contract suite (test/unit/drivers.contract.test.js) runs the same tests against the json file store,
  # PostgreSQL and MongoDB. Here both servers are service containers, and a server that does not answer fails the job
  # (REQUIRE_DATABASES) instead of skipping its part of the suite.
  drivers:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Driver contract suite
        run: npx mocha test/unit/drivers.contract.test.js
        env:
          REQUIRE_DATABASES: '1'
          TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres
          TEST_MONGODB_URL: mongodb://localhost:27017
